<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reports admin — SulphurUI</title>
<link rel="stylesheet" href="../styles.css?v=22">
<style>
  .ad-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .ad-bar select, .ad-bar button { padding: 8px 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
  .ad-counts { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; overflow-wrap: anywhere; }
  .ad-list { display: grid; gap: 8px; }
  .ad-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-width: 0; }
  .ad-item b { color: var(--ink); } .ad-item small { color: var(--ink-faint); display: block; overflow-wrap: anywhere; }
  .ad-view { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--surface); }
  .ad-view dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
  .ad-view dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .ad-log { max-height: 60vh; overflow: auto; background: #0d0d0c; padding: 12px; border-radius: 8px; font: 12px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <section class="block">
    <h2>Reports</h2>
    <div class="ad-bar">
      <select id="f-type"><option value="">All types</option><option>bug</option><option>suggestion</option></select>
      <select id="f-status"><option value="">All statuses</option><option>new</option><option>seen</option><option>fixed</option><option>wontfix</option></select>
      <select id="f-version"><option value="">All versions</option></select>
      <button id="reload" type="button">Refresh</button>
    </div>
    <div class="ad-counts" id="counts"></div>
    <div class="ad-list" id="list"></div>
    <div class="ad-view" id="view" hidden></div>
  </section>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function api(path, opts) {
    return fetch("/api/admin/" + path, Object.assign({ credentials: "same-origin" }, opts || {})).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + (r.status === 403 ? " (not signed in through Cloudflare Access)" : ""));
      return r.json();
    });
  }
  function load() {
    var q = new URLSearchParams();
    ["type", "status", "version"].forEach(function (k) { var v = $("f-" + k).value; if (v) q.set(k, v); });
    api("reports?" + q).then(function (d) {
      $("counts").textContent = d.counts.map(function (c) { return c.type + "/" + c.status + ": " + c.n; }).join("  ·  ") || "No reports yet.";
      var vs = $("f-version"), cur = vs.value;
      vs.innerHTML = '<option value="">All versions</option>' + d.versions.map(function (v) { return "<option>" + esc(v) + "</option>"; }).join("");
      vs.value = cur;
      $("list").innerHTML = d.rows.map(function (r) {
        return '<div class="ad-item" data-id="' + esc(r.id) + '"><b>[' + esc(r.status) + "] " + esc(r.type) + " · " + esc(r.character) +
          (r.realm ? "-" + esc(r.realm) : "") + "</b> v" + esc(r.version) + " · " + esc(r.client || "") +
          "<small>" + esc(r.created_at) + (r.log_len ? " · log " + r.log_len + " chars" : "") + " — " + esc(r.summary) + "</small></div>";
      }).join("") || "<p>Nothing matches.</p>";
    }).catch(function (e) { $("counts").textContent = e.message; });
  }
  function open(id) {
    api("reports/" + encodeURIComponent(id)).then(function (r) {
      var v = $("view"); v.hidden = false;
      var rows = ["type", "status", "created_at", "character", "realm", "issue_time", "version", "client", "contact", "doing", "issue", "suggestion"]
        .filter(function (k) { return r[k]; }).map(function (k) { return "<dt>" + k + "</dt><dd>" + esc(r[k]) + "</dd>"; }).join("");
      v.innerHTML = "<dl>" + rows + "</dl>" +
        '<div class="ad-bar" style="margin-top:12px">' +
        ["new", "seen", "fixed", "wontfix"].map(function (s) { return '<button type="button" data-st="' + s + '">Mark ' + s + "</button>"; }).join("") +
        '<button type="button" id="copy">Copy log</button><button type="button" id="del">Delete</button></div>' +
        (r.log ? '<pre class="ad-log" id="log"></pre>' : "<p>No log attached.</p>");
      if (r.log) $("log").textContent = r.log;
      v.querySelectorAll("[data-st]").forEach(function (b) {
        b.onclick = function () { api("reports/" + encodeURIComponent(id), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: b.dataset.st }) }).then(function () { load(); open(id); }); };
      });
      $("copy").onclick = function () { navigator.clipboard.writeText(r.log || ""); };
      $("del").onclick = function () { if (confirm("Delete this report?")) api("reports/" + encodeURIComponent(id), { method: "DELETE" }).then(function () { v.hidden = true; load(); }); };
    }).catch(function (e) { alert(e.message); });
  }
  $("list").addEventListener("click", function (e) { var it = e.target.closest(".ad-item"); if (it) open(it.dataset.id); });
  ["f-type", "f-status", "f-version"].forEach(function (id) { $(id).onchange = load; });
  $("reload").onclick = load;
  load();
})();
</script>
</body>
</html>
